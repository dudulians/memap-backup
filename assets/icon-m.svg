<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Aurora night-sky gradient: lighter teal top, deeper teal bottom.
       Hints at the aurora-borealis aesthetic without being literal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1F4D5E"/>
      <stop offset="100%" stop-color="#0F2A36"/>
    </linearGradient>
    <!-- Soft glow for the M strokes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- M as a connected line graph: 5 nodes + 4 segments.
       Reads as both the letter "M" and a pattern chart — fits MeMap. -->
  <g stroke="#3DEAD5" stroke-width="58" fill="none"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="
      290,800
      350,300
      512,620
      674,300
      734,800
    "/>
  </g>

  <!-- Dots — slightly larger than stroke width so they read as "beads". -->
  <g fill="#3DEAD5" filter="url(#glow)">
    <circle cx="290" cy="800" r="44"/>
    <circle cx="350" cy="300" r="44"/>
    <circle cx="512" cy="620" r="44"/>
    <circle cx="674" cy="300" r="44"/>
    <circle cx="734" cy="800" r="44"/>
  </g>

  <!-- A single warm pink dot at the V-dip center — the "you are here"
       beat that ties to the aurora strong/signal colour. Tiny accent. -->
  <circle cx="512" cy="620" r="18" fill="#F08597"/>
</svg>
