# Codemagic CI/CD configuration for MeMap (Capacitor + Vite + React).
#
# This builds the iOS app on a managed Apple Silicon Mac in the cloud
# and (once the App Store Connect integration is connected in the
# Codemagic UI) uploads the build to TestFlight.
#
# First-time setup checklist (do these once in the Codemagic UI):
#   1. Personal Account → Integrations → App Store Connect → "Add"
#      Paste an API Key from appstoreconnect.apple.com → Users and
#      Access → Integrations → App Store Connect API → Generate.
#   2. Personal Account → Integrations → Developer Portal → connect
#      the same API key (lets Codemagic create signing certificates
#      automatically without needing a Mac).
#   3. App settings → environment → integrations → enable
#      "App Store Connect" with the integration alias `codemagic`
#      (matches `auth: integration` in this file).

workflows:
  ios-testflight:
    name: MeMap iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    # No `ios_signing:` block: Codemagic's auto-fetch runs BEFORE
    # custom scripts, and on a fresh Apple Developer account neither
    # certificate nor profile exists yet — auto-fetch sees nothing to
    # fetch and fails. Instead we create both explicitly in the "Set
    # up code signing" script below, then patch the Xcode project.
    environment:
      vars:
        # Capacitor 8 uses Swift Package Manager (no CocoaPods), so it
        # creates App.xcodeproj — not App.xcworkspace. Point xcode-project
        # at the project file directly.
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.uliana.memap"
        # Apple Developer team — needed so xcodebuild can find the
        # right signing identity in the keychain even if `use-profiles`
        # didn't write the team into the .pbxproj.
        APPLE_TEAM_ID: "X4QQRGJ6C4"
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build the web bundle
        script: |
          npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          set -e
          echo "==> Initialize keychain"
          keychain initialize

          echo "==> Generate private key for the new distribution cert"
          # Codemagic's CLI can create the iOS Distribution certificate
          # via App Store Connect API, but it needs a private key on
          # disk to bind to. We just generate a fresh 2048-bit RSA key
          # for this build; the cert + key get downloaded together by
          # fetch-signing-files below.
          openssl genrsa -out /tmp/cert_private_key.pem 2048

          echo "==> Fetch signing files (creates cert + profile if missing)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_private_key.pem \
            --create

          echo "==> Add downloaded cert to keychain"
          keychain add-certificates

          echo "==> Patch Xcode project to use the fetched profile"
          cd $CM_BUILD_DIR/ios/App
          xcode-project use-profiles --code-signing-setup-verbose-logging

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build ipa
        script: |
          cd $CM_BUILD_DIR/ios/App
          # Belt-and-braces: pass DEVELOPMENT_TEAM via xcargs so xcodebuild
          # has a team set even if `use-profiles` failed to patch the
          # .pbxproj. The CODE_SIGN_STYLE=Manual + matched profile in
          # keychain is what makes archive succeed.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testing"
