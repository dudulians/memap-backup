# Codemagic CI/CD configuration for MeMap (Capacitor + Vite + React).
#
# This builds the iOS app on a managed Apple Silicon Mac in the cloud
# and (once the App Store Connect integration is connected in the
# Codemagic UI) uploads the build to TestFlight.
#
# First-time setup checklist (do these once in the Codemagic UI):
#   1. Personal Account → Integrations → App Store Connect → "Add"
#      Paste an API Key from appstoreconnect.apple.com → Users and
#      Access → Integrations → App Store Connect API → Generate.
#   2. Personal Account → Integrations → Developer Portal → connect
#      the same API key (lets Codemagic create signing certificates
#      automatically without needing a Mac).
#   3. App settings → environment → integrations → enable
#      "App Store Connect" with the integration alias `codemagic`
#      (matches `auth: integration` in this file).

workflows:
  ios-testflight:
    name: MeMap iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    # No `ios_signing:` block: Codemagic's auto-fetch runs BEFORE
    # custom scripts, and on a fresh Apple Developer account neither
    # certificate nor profile exists yet — auto-fetch sees nothing to
    # fetch and fails. Instead we create both explicitly in the "Set
    # up code signing" script below, then patch the Xcode project.
    environment:
      vars:
        # Capacitor 8 uses Swift Package Manager (no CocoaPods), so it
        # creates App.xcodeproj — not App.xcworkspace. Point xcode-project
        # at the project file directly.
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.uliana.memap"
        # Apple Developer team — needed so xcodebuild can find the
        # right signing identity in the keychain even if `use-profiles`
        # didn't write the team into the .pbxproj.
        APPLE_TEAM_ID: "X4QQRGJ6C4"
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build the web bundle
        script: |
          npm run build

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
          # Capacitor 8 on Windows generates Package.swift with backslash
          # path separators (..\..\..\node_modules\...) which Swift PM
          # on macOS cannot resolve — plugins silently fail to link and
          # native APIs like Haptics return success but do nothing.
          # Force-rewrite backslashes to forward slashes via Python (sed
          # backslash escaping is too quirky between bash + macOS sed).
          PKG="$CM_BUILD_DIR/ios/App/CapApp-SPM/Package.swift"
          if [ -f "$PKG" ]; then
            echo "==> Package.swift BEFORE patch:"
            grep "node_modules" "$PKG" || echo "(no node_modules lines)"
            python3 -c "p='$PKG'; d=open(p).read(); open(p,'w').write(d.replace(chr(92),'/'))"
            echo "==> Package.swift AFTER patch:"
            grep "node_modules" "$PKG" || echo "(no node_modules lines)"
          fi

          # `cap sync ios` regenerates ios/App/App/capacitor.config.json,
          # auto-populating packageClassList from npm packages only.
          # That wipes our entry for the host-app CoreHapticsPlugin
          # (lives in AppDelegate.swift, not in node_modules), so the
          # custom Core Haptics plugin can't be discovered at runtime
          # (the in-app diagnostic returned "CoreHaptics plugin is not
          # implemented on ios"). Re-inject it after sync so iOS can
          # find the class via NSClassFromString at startup.
          IOS_CFG="$CM_BUILD_DIR/ios/App/App/capacitor.config.json"
          if [ -f "$IOS_CFG" ]; then
            echo "==> Injecting CoreHapticsPlugin into iOS packageClassList"
            python3 -c "import json,sys; p='$IOS_CFG'; d=json.load(open(p)); l=d.setdefault('packageClassList', []); 'CoreHapticsPlugin' in l or l.append('CoreHapticsPlugin'); json.dump(d, open(p,'w'), indent=2)"
            echo "==> packageClassList after patch:"
            python3 -c "import json; print(json.load(open('$IOS_CFG')).get('packageClassList'))"
          fi

      - name: Set up code signing
        script: |
          set -e
          echo "==> Initialize keychain"
          keychain initialize

          echo "==> Revoke stale distribution certificates"
          # Apple limits us to 2 active distribution certificates per
          # team. We generate an ephemeral private key for each build,
          # so any cert created on a previous build is useless to us
          # (its key is gone). Revoke them all before creating a fresh
          # one — otherwise the API returns 409 ("You already have a
          # current Distribution certificate") and the build dies.
          #
          # Codemagic-cli-tools stores App Store Connect distribution
          # certs under the broader DISTRIBUTION type (see fetch-signing
          # -files internal filter "DISTRIBUTION,IOS_DISTRIBUTION"). We
          # query with both type values to be safe.
          for FILTER_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            echo "    listing certs of type $FILTER_TYPE"
            RAW=$(app-store-connect certificates list --type "$FILTER_TYPE" --json 2>/dev/null || echo "[]")
            IDS=$(echo "$RAW" | python3 -c "import json,sys; d=json.loads(sys.stdin.read() or '[]'); items = d if isinstance(d, list) else d.get('data', []); print(' '.join(c.get('id','') for c in items if c))" 2>/dev/null || echo "")
            if [ -n "$IDS" ]; then
              for cert_id in $IDS; do
                echo "    revoke $cert_id"
                app-store-connect certificates revoke "$cert_id" || true
              done
            else
              echo "    none found for $FILTER_TYPE"
            fi
          done

          echo "==> Generate private key for the new distribution cert"
          openssl genrsa -out /tmp/cert_private_key.pem 2048

          echo "==> Fetch signing files (creates cert + profile)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_private_key.pem \
            --create

          echo "==> Add downloaded cert to keychain"
          keychain add-certificates

          echo "==> Patch Xcode project to use the fetched profile"
          cd $CM_BUILD_DIR/ios/App
          xcode-project use-profiles --code-signing-setup-verbose-logging

      - name: Set build number
        script: |
          # Apple rejects an upload if its CFBundleVersion was used by a
          # prior upload. The previous approach (latest TestFlight build
          # + 1) silently fell through to "1" when the API call returned
          # empty, and TestFlight already had build 1 → 409 Conflict.
          #
          # Use a Unix-timestamp-derived integer instead: always strictly
          # increasing, never collides with anything Apple has seen.
          # `agvtool` writes this into Info.plist's CFBundleVersion.
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%s)
          echo "==> Setting build number to $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build ipa
        script: |
          cd $CM_BUILD_DIR/ios/App
          # Belt-and-braces: pass DEVELOPMENT_TEAM via xcargs so xcodebuild
          # has a team set even if `use-profiles` failed to patch the
          # .pbxproj. The CODE_SIGN_STYLE=Manual + matched profile in
          # keychain is what makes archive succeed.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        # We just upload the build to App Store Connect. After upload,
        # internal testers (= members of the App Store Connect team)
        # can install it from the TestFlight app on their phone
        # IMMEDIATELY — no Apple review, no beta-group needed.
        #
        # If/when we want to invite external testers (friends, family),
        # we'll set submit_to_testflight: true and add a beta_groups:
        # entry — but that requires filling Beta App Review info
        # (feedback email, contact details) in App Store Connect first.
        submit_to_testflight: false
